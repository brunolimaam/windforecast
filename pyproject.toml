[project]
name = "windforecast"
version = "0.1.0"
description = "Wind resource and energy yield assessment for a hypothetical five-turbine site in Schleswig-Holstein, from public data only"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }

dependencies = [
    "numpy>=1.26",
    "pandas>=2.3,<3",   # 2.3.x: last 2.x line. pandas 3 changes copy/string-dtype
    # semantics and is not yet well exercised with py_wake.
    "scipy>=1.13",
    "xarray>=2024.6",
    "netcdf4>=1.7",          # xarray engine for ERA5 NetCDF
    "matplotlib>=3.9",
    "cdsapi>=0.7.2",         # >=0.7.2 required for the new CDS (cds.climate.copernicus.eu/api)
    "requests>=2.32",        # DWD Open Data is plain HTTP
    "pyyaml>=6.0",           # site / run configuration
    "rasterio>=1.4.4",
    "statsmodels>=0.15.0",
    "geopandas>=1.1.4",
    "contextily>=1.7.1",
    "phonometry>=3.3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.6",
    "jupyterlab>=4.2",
    "ipykernel>=6.29",
    "nbconvert[webpdf]>=7.17.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/windforecast"]
# site.yaml and the power curve live inside the package, so they must be built
# into the wheel alongside the .py files.
artifacts = ["src/windforecast/config/*.yaml", "src/windforecast/config/*.csv"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
